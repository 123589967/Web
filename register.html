<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>R$Y的专属回忆.注册界面</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Simsun", "宋体", sans-serif;
  }

  body {
    background: linear-gradient(135deg, #CCE5FF 0%, #E8F4F8 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 20% 80%, rgba(246, 183, 183, 0.2) 0%, transparent 20%),
      radial-gradient(circle at 80% 20%, rgba(255, 105, 180, 0.2) 0%, transparent 20%);
    z-index: 0;
  }

  .Love {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1.05);
    width: 500px;
    height: 500px;
    z-index: -1;
    opacity: 0.85;
    filter: drop-shadow(0 10px 20px rgba(246, 183, 183, 0.3));
    animation: heartBeat 3s ease-in-out infinite;
  }

  .Love::before,
  .Love::after {
    content: "";
    position: absolute;
    top: 12%;
    width: 250px;
    height: 400px;
    border-radius: 250px 250px 0 0;
    background: linear-gradient(135deg, #F6B7B7 0%, #F9C5C5 50%, #F8AFAF 100%);
    transition: all 0.3s ease;
  }

  .Love::before {
    left: 250px;
    transform: rotate(-45deg);
    transform-origin: 0 100%;
  }

  .Love::after {
    left: 0;
    transform: rotate(45deg);
    transform-origin: 100% 100%;
  }

  .Register {
    position: relative;
    width: 420px;
    padding: 45px 40px 50px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(246, 183, 183, 0.1), 0 5px 15px rgba(0, 0, 0, 0.1);
    z-index: 1;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.8);
  }

  .Register h1 {
    text-align: center;
    margin-bottom: 35px;
    color: #333;
    font-size: 28px;
    font-weight: 600;
    position: relative;
  }

  .Register h1::after {
    content: "";
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, #F6B7B7, hotpink);
    border-radius: 3px;
  }

  .Input {
    margin-bottom: 25px;
    position: relative;
  }

  .Input-input {
    width: 100%;
    padding: 14px 20px 14px 45px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
    background: rgba(255, 255, 255, 0.8);
    transition: all 0.3s ease;
    color: #333;
  }

  .Input::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    background-size: contain;
    background-repeat: no-repeat;
    opacity: 0.6;
  }

  .Input:nth-child(2)::before {
    background-image: url(./Icon/1.png);
    background-size: contain;
    background-repeat: no-repeat;
  }

  .Input:nth-child(3)::before {
    background-image: url(./Icon/2.png);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }

  .Input:nth-child(4)::before {
    background-image: url(./Icon/3.png);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }

  .Input-input:focus {
    border-color: #F6B7B7;
    box-shadow: 0 0 0 3px rgba(246, 183, 183, 0.2);
    background: #fff;
  }

  .Input-input::placeholder {
    color: #999;
    font-size: 15px;
  }

  .Register-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #F6B7B7, #F8AFAF);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(246, 183, 183, 0.3);
    position: relative;
    overflow: hidden;
    margin-top: 10px;
  }

  .Register-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: all 0.5s ease;
  }

  .Register-btn:hover {
    background: linear-gradient(90deg, #F8AFAF, #F6B7B7);
    box-shadow: 0 6px 15px rgba(255, 105, 180, 0.4);
    transform: translateY(-2px);
  }

  .Register-btn:hover::before {
    left: 100%;
  }

  .Register-btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 5px rgba(246, 183, 183, 0.3);
  }

  @keyframes heartBeat {
    0% {
      transform: translate(-50%, -50%) scale(1.05);
    }

    50% {
      transform: translate(-50%, -50%) scale(1.1);
    }

    100% {
      transform: translate(-50%, -50%) scale(1.05);
    }
  }

  @media (max-width: 500px) {
    .Register {
      width: 90%;
      padding: 35px 25px 40px;
    }

    .Love {
      width: 400px;
      height: 400px;
    }

    .Love::before,
    .Love::after {
      width: 200px;
      height: 320px;
    }

    .Love::before {
      left: 200px;
    }
  }

  .Login {
    width: 100%;
    height: 30px;
    text-align: center;
    align-content: center;
    margin-top: 15px;
  }
</style>

<body>
  <div class="Love"></div>
  <div class="Register">
    <h1>注册</h1>

    <div class="Input">
      <input type="text" placeholder="用户名" name="username" id="username" class="Input-input" />
    </div>

    <div class="Input">
      <input type="password" placeholder="密码" name="password" id="password" class="Input-input" />
    </div>

    <div class="Input">
      <input type="email" placeholder="邮箱（可选）" name="email" id="email" class="Input-input" />
    </div>

    <button class="Register-btn">注册</button>

    <div class="Login">
      <a style="color: #999;" href="index.html">登录</a>
    </div>

  </div>

  <script>
    const registerBtn = document.querySelector('.Register-btn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const emailInput = document.getElementById('email');

    async function register() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      const email = emailInput.value.trim();

      if (!username || !password) {
        alert('请输入用户名和密码');
        return;
      }

      if (password.length < 6) {
        alert('密码长度不能少于6位');
        return;
      }

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password, email })
        });

        const result = await response.json();
        if (result.code === 0) {
          alert('注册成功！请登录');
          window.location.href = 'index.html';
        } else {
          alert(result.msg);
        }
      } catch (error) {
        console.error(error);
        alert('网络错误，请检查服务是否启动');
      }
    }

    registerBtn.addEventListener('click', register);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        register();
      }
    });
  </script>
</body>

</html>
