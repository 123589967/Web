  <script>
    const audio1 = document.getElementById('audio1');
    const audio2 = document.getElementById('audio2');
    const playNextBtn = document.getElementById('playNextBtn');
    const audioList = [audio1, audio2];
    let currentIndex = 0;

    async function playAudio(audio) {
      if (!audio) return;
      try {
        await audio.play();
      } catch (e) {
        console.log('播放失败:', e);
        const tip = document.createElement('div');
        tip.style.cssText = 'color: #ff6666; font-size: 12px; margin-top: 4px;';
        tip.innerText = '💡 需点击音频控件授权播放哦～';
        audio.parentNode.appendChild(tip);
        setTimeout(() => tip.remove(), 3000);
      }
    }

    function playNextAudio() {
      audioList[currentIndex].pause();
      audioList[currentIndex].currentTime = 0;
      currentIndex = (currentIndex + 1) % audioList.length;
      playAudio(audioList[currentIndex]);
    }

    audioList.forEach(audio => {
      audio.addEventListener('ended', playNextAudio);
    });

    playNextBtn.addEventListener('click', playNextAudio);

    audioList.forEach(audio => {
      audio.addEventListener('click', () => playAudio(audio), { once: true });
    });
  </script>

  <script>
    const startDate = new Date("2023-09-16T00:00:00");

    if (isNaN(startDate.getTime())) {
      document.getElementById("loveDays").innerText = "日期格式错误";
    } else {
      function calculateLoveDuration() {
        const now = new Date();

        const timeDiff = now - startDate;
        const totalDays = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

        let years = now.getFullYear() - startDate.getFullYear();
        let months = now.getMonth() - startDate.getMonth();
        let days = now.getDate() - startDate.getDate();

        if (days < 0) {
          months--;
          const lastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
          days += lastMonth.getDate();
        }

        if (months < 0) {
          years--;
          months += 12;
        }

        const formatNum = (num) => num.toString().padStart(2, '0');

        const displayText = `${formatNum(years)} 年 ${formatNum(months)} 月 ${formatNum(days)} 天 总计 ${totalDays} 天`;

        document.getElementById("loveDays").innerText = displayText;
      }

      calculateLoveDuration();
      setInterval(calculateLoveDuration, 1000);
    }
  </script>
